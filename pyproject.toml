[project]
name = "project1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "azure-ai-ml>=1.34.1",
    "azure-identity>=1.25.3",
    "azure-storage-blob>=12.27.1",
    "azureml-ai-monitoring>=1.0.0",
    "azureml-mlflow>=1.62.0.post5",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.11.0",
    "mlflow>=3",
    "mlxtend>=0.25.0",
    "numpy>=2.5.1",
    "pandas<3",
    "path>=17.1.1",
    "protobuf>=5",
    "psycopg2-binary>=2.9.12",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "torch>=2.9.0",
    "torchinfo>=1.8.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so `import utils.utils` / `import model.model`
# resolve without installing the project.
pythonpath = ["."]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# CUDA wheels on the dev machine (Windows), CPU wheels everywhere else (Linux CI).
# One lockfile carries both, so `uv sync --locked` is satisfiable on either.
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]
