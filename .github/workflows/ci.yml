name: CI

on:
  push:
  pull_request:

jobs:

  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies (locked)
        # Linux resolves torch/torchvision to the CPU wheels via the per-platform
        # sources in pyproject.toml -- no CUDA download on the runner.
        run: uv sync --locked --group dev

      - name: Run pytest
        run: uv run --group dev python -m pytest -q
